name: Verify foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      VITE_MAPTILER_API_KEY: ci-fixture-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build --workspaces --if-present
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-test-results
          path: test-results/
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: shuttlebook
          POSTGRES_USER: shuttlebook
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuttlebook -d shuttlebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      Identity__JwtSigningKey: 'ci-only-signing-key-more-than-32-bytes'
      Identity__OtpPepper: 'ci-only-otp-pepper-more-than-32-bytes'
      ConnectionStrings__ShuttleBook: 'Host=localhost;Port=5432;Database=shuttlebook;Username=shuttlebook;Password=ci-disposable-only'
      SHUTTLEBOOK_TEST_CONNECTION_STRING: 'Host=localhost;Port=5432;Database=postgres;Username=shuttlebook;Password=ci-disposable-only'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore backend/ShuttleBook.slnx --locked-mode
      - run: dotnet build backend/ShuttleBook.slnx --no-restore --configuration Release
      - run: dotnet run --project backend/src/ShuttleBook.Migrator --no-build --configuration Release
      - run: dotnet run --project backend/src/ShuttleBook.Migrator --no-build --configuration Release
      - run: dotnet test backend/tests/ShuttleBook.Api.Tests --no-build --configuration Release
      - run: dotnet test backend/tests/ShuttleBook.Database.Tests --no-build --configuration Release
  staging-package:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PARALLEL_LIMIT: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Create disposable staging fixture
        run: |
          cp deploy/staging.env.example .env.staging
          sed -i 's/REPLACE_WITH_SAME_PASSWORD/REPLACE_WITH_RANDOM_ALPHANUMERIC_PASSWORD/' .env.staging
          sed -i 's/^Media__Mode=S3$/Media__Mode=Local/' .env.staging
          mkdir -p deploy/secrets
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=CI DataProtection' -keyout /tmp/shuttlebook-ci-dp.key -out /tmp/shuttlebook-ci-dp.crt
          openssl pkcs12 -export -passout pass:REPLACE_WITH_PFX_EXPORT_PASSWORD -out deploy/secrets/dp.pfx -inkey /tmp/shuttlebook-ci-dp.key -in /tmp/shuttlebook-ci-dp.crt
          chmod 600 deploy/secrets/dp.pfx
          sudo chown 1654:1654 deploy/secrets/dp.pfx
      - name: Validate and build Linux package
        run: |
          docker compose --env-file .env.staging -f deploy/compose.staging.yml config --quiet
          docker compose --env-file .env.staging -f deploy/compose.staging.yml --profile tools build
      - name: Smoke test private staging stack
        run: |
          docker compose --env-file .env.staging -f deploy/compose.staging.yml up -d --wait --wait-timeout 180
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          curl --fail --silent http://127.0.0.1:5174/ > /dev/null
          curl --fail --silent http://127.0.0.1:5175/ > /dev/null
          docker compose --env-file .env.staging -f deploy/compose.staging.yml exec -T api curl --fail --silent http://127.0.0.1:8080/health/ready > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5173/api/v1/no-such-route)" = 404
      - name: Stop disposable stack
        if: always()
        run: docker compose --env-file .env.staging -f deploy/compose.staging.yml down -v --remove-orphans
